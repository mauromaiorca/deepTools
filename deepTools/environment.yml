name: deepTools
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.8
  - numpy>=1.21.6,<1.28.0
  - mrcfile
  - scipy>=1.8.0,<1.11.0
  - pytorch=2.0.0  # ensure CUDA 11.7 support as needed
  - torchvision=0.15.1
  - pip
  - pip:
      - torchmetrics
      - flatbuffers>=1.12
      - gast>=0.2.1
      - "keras>=2.8.0rc0,<2.9"
      - wrapt>=1.11.0
      - "tensorboard>=2.8.0,<2.9"
      - SimpleITK
      - scikit-image
      - pandas>=1.3.0,<2.0.0
      - starfile>=0.0.8,<1.0.0
      - cupy-cuda117>=10.2.0,<11.0.0
      - tqdm>=4.0.0,<5.0.0
      - biopython==1.73
